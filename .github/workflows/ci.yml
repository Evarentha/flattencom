name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/maintain-headers.py
      - run: python scripts/check-i18n.py
      - run: python scripts/check-docs.py
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config ninja-build libgl1-mesa-dev libxkbcommon-dev
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo build --workspace --locked
      - name: Configure
        run: cmake -S gui -B gui/build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build gui/build/debug --parallel
      - name: Test
        timeout-minutes: 15
        shell: bash
        # The Windows runner produced no captured stdout through ctest, so the
        # binary writes its own log and it is printed only when the run fails.
        run: |
          cd gui/build/debug
          bin=gui-tests
          if [ -f gui-tests.exe ]; then bin=gui-tests.exe; fi
          rm -f gui-tests.txt
          set +e
          "./$bin" -platform offscreen -o gui-tests.txt,txt
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "gui-tests exit code: $code"
            grep -nE 'FAIL|Totals' gui-tests.txt || true
            echo "--- full test log follows ---"
            cat gui-tests.txt
          fi
          exit $code
      - run: python scripts/gui-smoke.py

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p flattencom-proto --bin gen-schemas
      - run: git diff --exit-code -- schemas
