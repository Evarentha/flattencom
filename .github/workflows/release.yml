# flattencom - Release Artifact Workflow
#
# Builds and uploads Linux and Windows release packages after verification.
#
# Authors:
# worryzu <worryzu@gmail.com> @LinearTeam
#
# Copyright (C) 2026 Evarentha
# SPDX-License-Identifier: GPL-3.0-or-later

name: Release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config ninja-build libgl1-mesa-dev libxkbcommon-dev
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: runner.os == 'Linux'
        run: python scripts/package.py --generator TGZ --deploy-qt
      - if: runner.os == 'Windows'
        run: python scripts/package.py --generator ZIP --deploy-qt
      - run: python scripts/gui-smoke.py --bin-dir target/release --gui gui/build/release/flattencom-gui
      - uses: actions/upload-artifact@v4
        with:
          name: flattencom-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS

  release:
    # Only a version tag becomes a public release; manual runs on branches build
    # artifacts without publishing them.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flattencom-Linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: flattencom-Windows
          path: windows
      - name: Assemble published assets
        run: |
          mkdir -p release
          cp linux/* release/
          # The Windows job produces an identical-purpose source archive and its
          # own checksum file; keep the Linux copies so nothing is attached twice.
          rm -f release/SHA256SUMS
          for file in windows/*; do
            case "$(basename "$file")" in
              SHA256SUMS|*-source.tar.gz) ;;
              *) cp "$file" release/ ;;
            esac
          done
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > NOTES.md <<'EOF'
          Serial debugging workbench for Linux and Windows: a Qt desktop, CLI/TUI
          and MCP bridge over a shared local background service.

          Each archive contains the Qt desktop, the CLI/TUI, the background service
          and the MCP bridge together with the Qt runtime. The source archive
          matches this tag, and SHA256SUMS covers every file attached here.

          GPL-3.0-or-later. Copyright (C) 2026 Evarentha.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "flattencom ${GITHUB_REF_NAME#v}" \
            --notes-file NOTES.md \
            --verify-tag
